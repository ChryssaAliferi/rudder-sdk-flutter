group 'com.rudderstack.sdk.flutter'
version '1.0'

apply plugin: 'com.android.library'
// AGP 9+ ships built-in Kotlin support (unless Flutter opts out via android.builtInKotlin=false).
// Apply our own Kotlin plugin only when AGP won't — otherwise it clashes with Flutter's built-in Kotlin.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    compileSdk = 34

    defaultConfig {
        // SPIKE (FLT-102): Kotlin SDK requires API 21.
        minSdk = 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        // SPIKE (FLT-102): Kotlin SDK targets JVM 17.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (agpMajor < 9 || !builtInKotlin) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }
    namespace = "com.rudderstack.sdk.flutter"
}

dependencies {
    // SPIKE: legacy com.rudderstack.android.sdk:core and gson replaced by the Kotlin SDK.
    // kotlinx-serialization-json comes in transitively (exposed as `api` by the Kotlin core module).
    implementation 'com.rudderstack.sdk.kotlin:android:2.1.0'
}
